[workspace]
members = ["coactor", "coactor-macros"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/link-duan/coactor"
rust-version = "1.85"

[workspace.dependencies]
futures-util = "0.3.31"
async-trait = "0.1.89"
axum = "0.7.9"
aws-credential-types = "=1.2.3"
aws-sdk-s3 = "=1.96.0"
aws-smithy-types = "=1.3.2"
parking_lot = "0.12.4"
prost = "0.13.5"
tonic = "0.12.3"
tonic-build = "0.12.3"
proc-macro2 = "1.0.95"
quote = "1.0.40"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
syn = { version = "2.0.104", features = ["full"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tracing = "0.1.41"
uuid = { version = "1.18.0", features = ["v4"] }
