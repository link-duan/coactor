syntax = "proto3";

package coactor.transport.v1;

service Transport {
  // Client 与 Server 之间多路复用的双向消息通道，按 session_id 路由。
  rpc Exchange(stream Envelope) returns (stream Envelope);
}

message Envelope {
  uint32 protocol_version = 1;
  string actor_type = 2;
  bytes actor_id = 3;
  bytes session_id = 4;
  reserved 5;
  oneof kind {
    ActionMessage action = 6;
    SessionOpen session_open = 7;
    SessionClose session_close = 8;
    EventMessage event = 9;
    SessionError session_error = 10;
    SessionOpenedAck session_opened_ack = 11;
  }
}

message ActionMessage {
  bytes payload = 1;
}

message EventMessage {
  bytes payload = 1;
}

message SessionOpen {
  reserved 1;
}

message SessionClose {
  CloseReason reason = 1;
}

message SessionError {
  RuntimeFailure failure = 1;
}

message SessionOpenedAck {
  oneof outcome {
    bytes ok = 1;
    RuntimeFailure failure = 2;
  }
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CALLER_DROPPED = 1;
  RUNTIME_SHUTDOWN = 2;
  ACTOR_TERMINATED = 3;
}

enum RuntimeFailure {
  RUNTIME_FAILURE_UNSPECIFIED = 0;
  MAILBOX_FULL = 1;
  ACTIVATION_FAILED = 2;
  ACTOR_DEACTIVATING = 3;
  RUNTIME_AT_CAPACITY = 4;
  RUNTIME_SHUTTING_DOWN = 5;
  ACTOR_STOPPED = 6;
  RUNTIME_STOPPED = 7;
  PROTOCOL_MISMATCH = 8;
  ACTOR_TYPE_NOT_REGISTERED = 9;
  MALFORMED_PAYLOAD = 10;
  REMOTE_UNAVAILABLE = 11;
  NODE_FENCED = 12;
  OWNERSHIP_UNAVAILABLE = 13;
  NOT_OWNER = 14;
}
