[package]
name = "coactor"
version = "0.1.0"
description = "An embedded distributed Actor runtime for Rust applications"
readme = "../README.md"
documentation = "https://docs.rs/coactor"
keywords = ["actor", "distributed", "runtime", "tokio"]
categories = ["asynchronous", "concurrency"]
autotests = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-types.workspace = true
coactor-macros = { path = "../coactor-macros" }
futures-util.workspace = true
hex.workspace = true
parking_lot.workspace = true
prost.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }
trybuild = "1.0.105"

[[example]]
name = "counter_server"
path = "examples/counter_server.rs"

[[example]]
name = "counter_client"
path = "examples/counter_client.rs"

[[example]]
name = "chat_server"
path = "examples/chat_server.rs"

[[example]]
name = "chat_client"
path = "examples/chat_client.rs"

[[test]]
name = "macro_ui"
path = "tests/macro_ui.rs"
