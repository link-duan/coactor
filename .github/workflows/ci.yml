name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Run counter example
        run: cargo run --locked -p coactor --example counter
