name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Run counter example
        run: cargo run --locked -p coactor --example counter

  s3-integration:
    name: S3 ownership semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Start MinIO S3 endpoint
        run: |
          docker run --detach --name coactor-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=test-access-key \
            --env MINIO_ROOT_PASSWORD=test-secret-key \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if docker exec coactor-minio \
              mc alias set ci http://127.0.0.1:9000 test-access-key test-secret-key >/dev/null 2>&1 \
              && docker exec coactor-minio mc ready ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs coactor-minio
          exit 1

      - name: Run MinIO ownership semantics
        env:
          COACTOR_S3_ENDPOINT: http://127.0.0.1:9000
          COACTOR_S3_BUCKET: coactor-minio-ci
        run: |
          cargo test --locked -p coactor --lib node_and_actor_records_obey_conditional_s3_updates -- --ignored --test-threads=1
          cargo test --locked -p coactor --lib multiple_runtimes_preserve_ownership_lifecycle_through_s3 -- --ignored --test-threads=1

      - name: Show MinIO diagnostics
        if: always()
        run: |
          docker logs coactor-minio || true
          docker rm --force coactor-minio || true
