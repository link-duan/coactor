name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Check documentation structure
        run: python3 scripts/check-docs.py

      - name: Run documentation tests
        run: cargo test --locked --workspace --doc --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Check examples
        run: cargo check --locked -p coactor --examples

  coverage:
    name: Unit test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure unit test coverage
        run: >-
          cargo llvm-cov --locked --workspace --lib --all-features
          --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          disable_search: true
          flags: unit
          name: unit-tests
          fail_ci_if_error: true
          use_oidc: true

  chat-example:
    name: Chat example integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Run chat example integration test
        run: python3 scripts/test-chat-example.py

  s3-contract:
    name: S3 HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Run S3 HTTP contract tests
        run: >-
          cargo test --locked -p coactor --lib s3_coordination_tests:: --
          --test-threads=1
